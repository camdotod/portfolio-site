<!doctype html>
<html lang="en">
  <head>
    <!--Meta Tags-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />

    <!--Site Info-->
    <title>Projects - Camryn O'Donnell</title>
    <meta
      name="description"
      content="Camryn O'Donnell is a multidisciplinary designer with experience in design research, UX/UI design, and product design."
    />
    <meta name="author" content="Camryn O'Donnell" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/SVG/camod-logo-black.svg"
    />

    <!--Stylesheet-->
    <link rel="stylesheet" href="/styles/main.css" />

    <!--Material Design Icons-->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!--IBM Plex Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!--Public Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="text-fg-color bg-bg-color font-sans">
    <header>
      <noscript
        >JavaScript must be enabled for this content to display</noscript
      >
    </header>

    <!--Projects Header-->
    <h1 id="page-title" class="px-6 font-medium md:px-60 md:text-xl">
      Projects
    </h1>

    <!--Projects-->
    <main class="flex h-fit flex-col items-start gap-10">
      <section
        id="portfolio-index"
        class="flex w-full flex-col gap-10 px-6 md:px-60"
        aria-label="All Projects"
      >
        <div
          class="flex w-full flex-col items-start gap-0 divide-x-0 divide-y-2 text-lg md:flex-row md:gap-10 md:divide-x-2 md:divide-y-0"
        >
          <fieldset
            id="filters"
            class="flex w-full grow-0 gap-4 pt-4 pb-4 text-xl sm:w-1/6 md:flex-col md:gap-6 md:pb-0"
            role="radiogroup"
          >
            <legend>Sort By:</legend>
            <input
              id="tags-sort"
              type="radio"
              name="sort"
              class="peer hidden"
            />
            <label
              for="tags-sort"
              id="tags-sort-label"
              tabindex="0"
              class="border-fg-color hover:border-green hover:bg-green/10 focus:border-green focus:bg-green/10 peer-checked:border-green peer-checked:bg-green/10 peer-checked:outline-green w-fit border px-2 py-1 peer-checked:border active:underline"
            >
              Tags
            </label>
            <div class="flex items-start justify-start md:flex-col">
              <input
                id="name-sort"
                type="radio"
                name="sort"
                class="peer hidden"
              />
              <label
                for="name-sort"
                id="name-sort-label"
                tabindex="0"
                class="border-fg-color hover:border-red hover:bg-red/10 peer-checked:bg-red/10 focus:border-red focus:bg-red/10 peer-checked:border-red peer-checked:outline-red w-fit border px-2 py-1 peer-checked:border active:underline"
              >
                Name
              </label>
            </div>
            <div class="flex items-start justify-start md:flex-col">
              <input
                id="date-sort"
                type="radio"
                name="sort"
                class="peer hidden"
              />
              <label
                for="date-sort"
                id="date-sort-label"
                class="border-fg-color hover:border-blue hover:bg-blue/10 focus:border-blue focus:bg-blue/10 peer-checked:border-blue peer-checked:bg-blue/10 peer-checked:outline-blue w-fit border px-2 py-1 peer-checked:border active:underline"
                tabindex="0"
              >
                Date
              </label>
            </div>
          </fieldset>
          <div
            id="project-list"
            class="flex w-full flex-col gap-16 pt-10 md:w-4/6 md:pt-0 md:pl-10"
          >
            <noscript>This content requires JavaScript to be enabled.</noscript>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <noscript
        >For optimal site experience, please enable Javascript.</noscript
      >
    </footer>
  </body>
  <script type="module" src="/scripts/portfolioIndex.js"></script>
  <script src="/scripts/script.js"></script>
</html>
