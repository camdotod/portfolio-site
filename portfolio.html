<!doctype html>
<html lang="en">
  <head>
    <!--Meta Tags-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />

    <!--Site Info-->
    <title>Projects - Camryn O'Donnell</title>
    <meta
      name="description"
      content="Camryn O'Donnell is a multidisciplinary designer with experience in design research, UX/UI design, and product design."
    />
    <meta name="author" content="Camryn O'Donnell" />

    <link rel="icon" type="image/x-icon" href="/assets/Logo-P22.png" />

    <!--Stylesheet-->
    <link rel="stylesheet" href="/styles/main.css" />

    <!--Material Design Symbols-->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300&icon_names=alternate_email,chevron_line_up,collapse_content,deployed_code,expand_content,menu,open_in_new,work&display=block"
      rel="stylesheet"
    />

    <!--IBM Plex Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!--Public Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Archivo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="text-fg-color bg-bg-color font-sans">
    <header>
      <noscript
        >JavaScript must be enabled for this content to display</noscript
      >
    </header>

    <!--Projects Header-->
    <h1
      id="page-title"
      class="font-display px-6 font-medium md:px-60 md:text-xl"
    >
      Projects
    </h1>

    <!--Projects-->
    <main class="flex h-fit flex-col items-start gap-10">
      <section
        id="portfolio-index"
        class="flex w-full flex-col gap-10 px-6 py-10 md:px-60"
        aria-label="All Projects"
      >
        <div
          class="flex w-full flex-col items-start gap-0 divide-x-0 divide-y-1 md:divide-y-0 lg:flex-row-reverse lg:gap-10"
        >
          <fieldset
            id="filters"
            class="flex w-full grow-0 pt-4 pb-4 lg:w-1/6 lg:flex-col lg:gap-6 lg:pb-0"
            role="radiogroup"
          >
            <legend class="font-display text-sm">Sort By:</legend>
            <div class="flex">
              <input
                id="date-sort"
                type="radio"
                name="sort"
                class="peer hidden"
              />
              <label
                for="date-sort"
                id="date-sort-label"
                class="hover:bg-calm-400/20 focus:bg-calm-400/20 peer-checked:bg-calm-400/20 peer-checked:outline-calm-400 w-fit rounded-2xl px-4 py-2 font-medium active:underline"
                tabindex="0"
              >
                Date
              </label>
            </div>
            <div class="flex">
              <input
                id="tags-sort"
                type="radio"
                name="sort"
                class="peer hidden"
              />
              <label
                for="tags-sort"
                id="tags-sort-label"
                tabindex="0"
                class="hover:bg-fresh-400/20 focus:bg-fresh-400/20 peer-checked:bg-fresh-400/20 peer-checked:outline-fresbg-fresh-400 w-fit rounded-2xl px-4 py-2 font-medium active:underline"
              >
                Tags
              </label>
            </div>
            <div class="flex">
              <input
                id="name-sort"
                type="radio"
                name="sort"
                class="peer hidden"
              />
              <label
                for="name-sort"
                id="name-sort-label"
                tabindex="0"
                class="hover:bg-vigor-400/20 focus:bg-vigor-400/20 peer-checked:bg-vigor-400/20 peer-checked:outline-vigbg-vigor-400 w-fit rounded-2xl px-4 py-2 font-medium active:underline"
              >
                Name
              </label>
            </div>
          </fieldset>
          <ol
            id="project-list"
            class="flex w-full flex-col gap-4 pt-4 lg:grid lg:grid-cols-2"
          >
            <noscript>This content requires JavaScript to be enabled.</noscript>
          </ol>
        </div>
      </section>

      <!-- Modal -->
      <div
        id="project-modal-overlay"
        class="bg-hatch-light dark:bg-hatch-dark bg-bg-color/50 fixed top-0 left-0 z-20 hidden h-lvh w-lvw lg:px-40 lg:py-12"
      >
        <div
          id="project-modal"
          class="bg-bg-color flex h-svh w-svw touch-none flex-col divide-y overflow-hidden border shadow-2xl lg:h-auto lg:w-full lg:touch-auto lg:self-stretch"
        >
          <!-- Project Header-->
          <div
            class="font-display flex items-center self-stretch px-6 pt-10 pb-3 text-2xl lg:pt-4"
          >
            <!-- Title -->
            <p id="project-title" class="grow">LiUNA Dues Dashboard</p>
            <!-- Close Button -->
            <button
              id="close-button"
              class="active:bg-fg-color/10 h-10 w-10 rounded-2xl active:opacity-80"
              aria-label="Close project details"
            >
              <span
                id="menu-button-icon"
                class="material-symbols-outlined align-middle"
                >collapse_content</span
              >
            </button>
          </div>
          <!-- Project Details-->
          <div
            id="project-details"
            class="divide-fg-color/50 flex items-baseline gap-3 divide-x self-stretch px-6"
          >
            <p id="project-tags" class="font-display grow py-2 text-sm">
              UX/UI Design
            </p>
            <p id="project-yr" class="font-display text-sm">2025</p>
          </div>
          <div
            id="project-carousel"
            class="carousel bg-hatch relative flex flex-1 touch-pan-x snap-x snap-mandatory gap-0 self-stretch overflow-x-scroll"
          >
            <div
              class="flex w-svw shrink-0 snap-start self-stretch overflow-hidden lg:w-full"
            >
              <img
                id="project-img-1"
                class="flex-1 self-stretch object-contain"
                src="/assets/Dues Dashboard/Dues_Dashboard-Image_0.png"
                alt="ENTER_ALT_TEXT"
              />
            </div>
            <div
              class="flex w-svw shrink-0 snap-start self-stretch overflow-hidden lg:w-full"
            >
              <img
                id="project-img-2"
                class="flex-1 self-stretch object-contain"
                src="/assets/Dues Dashboard/Dues_Dashboard-Image_3.png"
                alt="ENTER_ALT_TEXT"
              />
            </div>
            <div
              class="flex w-svw shrink-0 snap-start self-stretch overflow-hidden lg:w-full"
            >
              <img
                id="project-img-3"
                class="flex-1 self-stretch object-contain"
                src="/assets/Dues Dashboard/Dues_Dashboard-Image_4.png"
                alt="ENTER_ALT_TEXT"
              />
            </div>
          </div>
          <div
            id="project-description"
            class="divide-fg-color/50 text-fg-color/80 border-fg-color/50 flex h-fit flex-col divide-y self-stretch overflow-hidden lg:flex-row lg:divide-x lg:divide-y-0"
          >
            <div id="project-desc" class="grow p-6 lg:flex-3 lg:self-stretch">
              In partnership with the organization’s admin and developers, I
              redesigned the payment history page on the member portal to be
              more clear and transparent about payments and current balances.
            </div>
            <!-- Image 1 Desc -->
            <div
              id="caption-1"
              class="hover:bg-fg-color/5 block min-h-10 self-stretch lg:flex lg:flex-1 lg:gap-1 lg:has-checked:flex-2"
            >
              <label
                class="group not-has-checked:bg-hatch border-fg-color block px-6 py-4 not-has-checked:overflow-hidden not-has-checked:text-ellipsis not-has-checked:whitespace-nowrap has-checked:border-l-2 lg:flex lg:grow lg:flex-col lg:gap-2 lg:not-has-checked:overflow-auto lg:not-has-checked:whitespace-normal lg:has-checked:border-b-4 lg:has-checked:border-l-0"
                onClick="window.location='#project-img-1';"
              >
                <input
                  type="radio"
                  name="carousel"
                  class="peer hidden"
                  aria-hidden="true"
                  checked
                />
                <p
                  class="text-fg-color font-display inline text-sm font-medium opacity-60 group-hover:opacity-100 peer-checked:opacity-100"
                >
                  Image 1:
                </p>
                <p
                  class="inline text-sm opacity-80 group-hover:opacity-90 peer-checked:text-base lg:text-base"
                >
                  Documentation documentation something something
                </p>
              </label>
            </div>
            <!-- Image 2 Desc -->
            <div
              id="caption-2"
              class="hover:bg-fg-color/5 block min-h-10 self-stretch lg:flex lg:flex-1 lg:gap-1 lg:has-checked:flex-2"
            >
              <label
                class="group not-has-checked:bg-hatch border-fg-color block px-6 py-4 not-has-checked:overflow-hidden not-has-checked:text-ellipsis not-has-checked:whitespace-nowrap has-checked:border-l-2 lg:flex lg:grow lg:flex-col lg:gap-2 lg:not-has-checked:overflow-auto lg:not-has-checked:whitespace-normal lg:has-checked:border-b-4 lg:has-checked:border-l-0"
                onClick="window.location='#project-img-2';"
              >
                <input
                  type="radio"
                  name="carousel"
                  class="peer hidden"
                  aria-hidden="true"
                />
                <p
                  class="text-fg-color font-display inline text-sm font-medium opacity-60 group-hover:opacity-100 peer-checked:opacity-100"
                >
                  Image 2:
                </p>
                <p
                  class="inline text-sm opacity-80 group-hover:opacity-90 peer-checked:text-base lg:text-base"
                >
                  Documentation for something else
                </p>
              </label>
            </div>
            <!-- Image 3 Desc -->
            <div
              id="caption-3"
              class="hover:bg-fg-color/5 block min-h-10 self-stretch lg:flex lg:flex-1 lg:gap-1 lg:has-checked:flex-2"
            >
              <label
                class="group not-has-checked:bg-hatch border-fg-color block px-6 py-4 not-has-checked:overflow-hidden not-has-checked:text-ellipsis not-has-checked:whitespace-nowrap has-checked:border-l-2 lg:flex lg:grow lg:flex-col lg:gap-2 lg:not-has-checked:overflow-auto lg:not-has-checked:whitespace-normal lg:has-checked:border-b-4 lg:has-checked:border-l-0"
                onClick="window.location='#project-img-3';"
                role="caption"
              >
                <input
                  type="radio"
                  name="carousel"
                  class="peer hidden"
                  aria-hidden="true"
                />
                <p
                  class="text-fg-color font-display inline text-sm font-medium opacity-60 group-hover:opacity-100 peer-checked:opacity-100"
                >
                  Image 3:
                </p>
                <p
                  class="inline text-sm opacity-80 group-hover:opacity-90 peer-checked:text-base lg:text-base"
                >
                  Documentation given to 3rd party
                </p>
              </label>
            </div>
          </div>
          <a
            id="case-study-link"
            href="portfolio/Dues_Dashboard.html"
            class="bg-calm-600 text-bg-color dark:bg-calm-400 flex justify-center self-stretch py-4 underline"
          >
            Read the case study →
          </a>
        </div>
      </div>
    </main>
    <footer>
      <noscript
        >For optimal site experience, please enable Javascript.</noscript
      >
    </footer>
  </body>
  <script type="module" src="/scripts/portfolioIndex.js"></script>
  <script src="/scripts/script.js"></script>
</html>
